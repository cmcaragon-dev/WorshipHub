<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #2c3e50,
            #3498db
        );

}

.login-container {

    width: 400px;

    max-width: 90%;

    background: white;

    padding: 35px;

    border-radius: 15px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);

}

.login-container h1 {

    text-align: center;

    margin-bottom: 10px;

}

.login-subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 25px;

}

.login-container input {

    width: 100%;

    padding: 13px;

    margin-bottom: 15px;

    border:
        1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;

}

.login-container button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 8px;

    background: #3498db;

    color: white;

    font-size: 16px;

    cursor: pointer;

}

.login-container button:hover {

    background: #2980b9;

}

#loginMessage {

    margin-top: 15px;

    text-align: center;

    color: #d32f2f;

}

.register-link {

    margin-top: 20px;

    text-align: center;

}

.register-link a {

    color: #3498db;

    text-decoration: none;

}

</style>

</head>

<body>


<div class="login-container">

    <h1>🎵 Worship Songs</h1>

    <div class="login-subtitle">

        Sign in to your account

    </div>


    <input
        type="email"
        id="email"
        placeholder="Email address"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
    >


    <button id="loginBtn">

        🔐 Login

    </button>


    <div id="loginMessage"></div>


    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>

</div>


<script
    type="module"
    src="js/auth.js">
</script>


</body>

</html>
