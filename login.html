<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial, Helvetica, sans-serif;

    background:#eef2f7;

}

.login-box{

    width:380px;

    max-width:90%;

    background:white;

    padding:35px;

    border-radius:15px;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

h1{

    text-align:center;

    margin-bottom:25px;

    color:#2c3e50;

}

input{

    width:100%;

    padding:13px;

    margin-bottom:15px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:16px;

}

button{

    width:100%;

    padding:13px;

    border:none;

    border-radius:8px;

    background:#3498db;

    color:white;

    font-size:16px;

    cursor:pointer;

}

button:hover{

    background:#2980b9;

}

#error{

    color:#e74c3c;

    text-align:center;

    margin-top:15px;

}

</style>

</head>

<body>

<div class="login-box">

    <h1>🎵 Worship Songs</h1>

    <form id="loginForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <div id="error"></div>

</div>


<script src="js/auth.js"></script>

</body>

</html>
