<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#eef2f7;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
}

.register-box{

    width:380px;

    background:white;

    padding:35px;

    border-radius:15px;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

}

h1{

    text-align:center;

    margin-bottom:25px;

}

input{

    width:100%;

    padding:13px;

    margin-bottom:15px;

    border:1px solid #ccc;

    border-radius:8px;

    box-sizing:border-box;

}

button{

    width:100%;

    padding:13px;

    border:none;

    border-radius:8px;

    background:#3498db;

    color:white;

    font-size:16px;

    cursor:pointer;

}

button:hover{

    background:#2980b9;

}

#message{

    margin-top:15px;

    text-align:center;

    font-size:14px;

}

.login-link{

    text-align:center;

    margin-top:20px;

}

</style>

</head>

<body>

<div class="register-box">

    <h1>Create Account</h1>

    <form id="registerForm">

        <input
            type="text"
            id="registerName"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            id="registerEmail"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="registerPassword"
            placeholder="Password"
            minlength="6"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            minlength="6"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div id="message"></div>

    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script type="module" src="js/register.js"></script>

</body>

</html>
