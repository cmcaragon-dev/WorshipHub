<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorshipHub Custom Song</title>
<link rel="stylesheet" href="css/modern.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#05070c;color:#fff;font-family:Inter,"Segoe UI",Arial,sans-serif}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 18px;background:#10182a;border-bottom:1px solid #26334d}.title{flex:1}.title h1{margin:0;font-size:20px}.title small{color:#9fb0ca}.key{font-weight:800;color:#D4AF37}.controls button{border:1px solid #D4AF37;background:#182238;color:#fff;border-radius:8px;padding:8px 12px}.controls button:hover{background:#3a3117;color:#FFD966}.stage{max-width:1400px;margin:0 auto;padding:36px 5vw}.section{margin-bottom:44px}.section-title{text-transform:uppercase;letter-spacing:.12em;color:#D4AF37;font-size:18px;font-weight:800;margin-bottom:22px}.line{font-family:Consolas,Monaco,"Courier New",monospace;margin-bottom:22px;overflow-x:auto}.chords{position:relative;height:32px;white-space:pre;color:#D4AF37 !important;font-size:clamp(18px,2vw,27px);font-weight:800}.chord{position:absolute;white-space:nowrap;color:#D4AF37 !important}.lyrics{white-space:pre;font-size:clamp(22px,3vw,40px);line-height:1.35}.nav{display:flex;justify-content:center;gap:10px;padding:14px;background:#0c1220;border-top:1px solid #26334d;position:sticky;bottom:0}.nav button{border:1px solid #35435e;background:#182238;color:#fff;border-radius:8px;padding:10px 16px;font-weight:800}.nav span{padding:10px 14px;color:#aebbd0}.nav button:disabled{opacity:.35;cursor:not-allowed}.chord{color:#D4AF37 !important}.empty{padding:80px;text-align:center;color:#9fb0ca}
</style>

<style>
html,body{background:#f4f7fb!important;color:#18212f!important}
body{overflow-x:hidden}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96)!important;color:#18212f!important;border-bottom:1px solid #e4e9f0!important;padding:8px 12px!important;gap:8px!important}
.title h1{color:#18212f!important;font-size:clamp(18px,2.2vw,28px)!important}
.title small{color:#667085!important}
.key{color:#8b6500!important}
.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start}
.controls button{background:#fff!important;color:#344054!important;border:1px solid #d8dee8!important;border-radius:7px!important;padding:6px 9px!important;font-size:12px!important}
.stage{max-width:1800px!important;margin:0 auto!important;padding:12px 18px 24px!important}
.stage .section{background:#fff;border-radius:10px;padding:12px 14px;margin:0 0 12px;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.stage .section-title{color:#8b6500!important;font-size:16px!important;margin:0 0 5px!important}
.stage .line{margin:0!important;padding:0!important;line-height:1!important}
.stage .chords{height:1em!important;line-height:1!important;margin:0!important;padding:0!important}
.stage .lyrics{font-family:Consolas,Monaco,"Courier New",monospace!important;font-size:clamp(15px,1.25vw,20px)!important;line-height:1!important}
.nav{padding:6px 10px!important;background:#fff!important;border-top:1px solid #e4e9f0!important}
.nav button{background:#fff!important;color:#344054!important;border:1px solid #d8dee8!important;border-radius:7px!important;padding:7px 10px!important;font-size:12px!important}
#stage{column-count:2;column-gap:28px;column-fill:auto}
#stage .section{break-inside:avoid;column-break-inside:avoid}
@media(max-width:900px){#stage{column-count:1!important}.stage{padding:10px 12px 20px!important}.top{flex-wrap:wrap}.title{min-width:100%}}
</style>


<style>
/* Custom-song controls/editor */
.controls button{transition:.18s ease}
.controls button:hover{transform:translateY(-1px);border-color:#b8942e!important}
body.dark-custom{background:#0b1020!important;color:#f8fafc!important}
body.dark-custom .top,body.dark-custom .stage .section,body.dark-custom .nav{background:#111827!important;color:#f8fafc!important;border-color:#273449!important}
body.dark-custom .title h1{color:#f8fafc!important}.dark-custom .title small{color:#aab7cb!important}
body.dark-custom .lyrics{color:#f8fafc!important}
body.dark-custom .stage .section-title{color:#e4bf52!important}
.custom-editor-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px}
.custom-editor-card{width:min(1100px,96vw);max-height:92vh;overflow:auto;background:#fff;color:#18212f;border-radius:16px;box-shadow:0 25px 80px rgba(0,0,0,.25);padding:20px}
.custom-editor-card h2{margin:0 0 4px}.custom-editor-note{color:#667085;font-size:13px;margin-bottom:16px}
.custom-edit-section{font-weight:800;color:#8b6500;border-top:1px solid #e5e7eb;padding:12px 0 6px}
.custom-edit-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.custom-edit-row textarea{width:100%;min-height:52px;resize:vertical;font:16px/1.2 Consolas,monospace;padding:9px;border:1px solid #d8dee8;border-radius:8px;white-space:pre}
.custom-editor-actions{display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:12px}
.custom-editor-actions button{border:1px solid #d8dee8;background:#fff;border-radius:8px;padding:9px 13px;font-weight:700}.custom-editor-actions .primary{background:#182238;color:#fff;border-color:#182238}
.custom-presentation{position:fixed;inset:0;z-index:100000;background:#05070c;color:#fff;display:none;flex-direction:column}
.custom-presentation.show{display:flex}
.custom-presentation-head{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid #26334d;background:#10182a}
.custom-presentation-head h2{margin:0;font-size:clamp(18px,2vw,30px)}.custom-presentation-head .pkey{margin-left:auto;color:#e4bf52;font-weight:800}
.custom-presentation-body{flex:1;overflow:auto;padding:28px 5vw}
.custom-presentation-section{max-width:1500px;margin:0 auto 22px;break-inside:avoid}
.custom-presentation-section h3{color:#e4bf52;margin:0 0 6px;text-transform:uppercase;letter-spacing:.08em}
.custom-presentation-line{font-family:Consolas,monospace;margin:0;padding:0;line-height:1}
.custom-presentation-chord{white-space:pre;color:#e4bf52;font-size:clamp(13px,1.2vw,20px);font-weight:800;line-height:1}
.custom-presentation-lyrics{white-space:pre;font-size:clamp(22px,3vw,42px);line-height:1.05}
.custom-presentation-close{margin-left:auto}
@media(max-width:700px){.custom-edit-row{grid-template-columns:1fr}.custom-presentation-body{padding:18px 16px}}
</style>
</head>
<body>
<div class="top"><div class="title"><h1 id="songTitle">WorshipHub</h1><small id="songArtist"></small></div><div class="key">Key: <span id="songKey">—</span></div><div class="controls">
<button id="homeBtn" title="Home">⌂ Home</button>
<button id="down" title="Transpose down one semitone">− Transpose</button>
<button id="up" title="Transpose up one semitone">+ Transpose</button>
<button id="minus" title="Decrease font">A−</button>
<button id="plus" title="Increase font">A+</button>
<button id="themeBtn" title="Toggle dark/light mode">☾ Dark</button>
<button id="presentationBtn" title="Open presentation">▣ Presentation</button>
<button id="editBtn" title="Edit chords and lyrics">✎ Edit</button>
</div></div>
<main id="stage" class="stage"><div class="empty">Loading song…</div></main>
<div class="nav"><button id="prev">◀ Previous</button><span id="counter">Song</span><button id="next">Next ▶</button></div>

<div id="customPresentation" class="custom-presentation" aria-hidden="true">
  <div class="custom-presentation-head">
    <h2 id="pSongTitle"></h2><span id="pSongArtist"></span><span class="pkey">Key: <span id="pSongKey"></span></span>
    <button id="pClose" class="custom-presentation-close">✕ Close</button>
  </div>
  <div id="pBody" class="custom-presentation-body"></div>
</div>
<script type="module" src="js/custom-song-runtime.js"></script>
<script src="js/print-preview.js"></script>
</body>
</html>
