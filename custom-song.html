<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorshipHub Custom Song</title>
<link rel="stylesheet" href="css/modern.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#05070c;color:#fff;font-family:Inter,"Segoe UI",Arial,sans-serif}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 18px;background:#10182a;border-bottom:1px solid #26334d}.title{flex:1}.title h1{margin:0;font-size:20px}.title small{color:#9fb0ca}.key{font-weight:800;color:#D4AF37}.controls button{border:1px solid #D4AF37;background:#182238;color:#fff;border-radius:8px;padding:8px 12px}.controls button:hover{background:#3a3117;color:#FFD966}.stage{max-width:1400px;margin:0 auto;padding:36px 5vw}.section{margin-bottom:44px}.section-title{text-transform:uppercase;letter-spacing:.12em;color:#D4AF37;font-size:18px;font-weight:800;margin-bottom:22px}.line{font-family:Consolas,Monaco,"Courier New",monospace;margin-bottom:22px;overflow-x:auto}.chords{position:relative;height:32px;white-space:pre;color:#D4AF37 !important;font-size:clamp(18px,2vw,27px);font-weight:800}.chord{position:absolute;white-space:nowrap;color:#D4AF37 !important}.lyrics{white-space:pre;font-size:clamp(22px,3vw,40px);line-height:1.35}.nav{display:flex;justify-content:center;gap:10px;padding:14px;background:#0c1220;border-top:1px solid #26334d;position:sticky;bottom:0}.nav button{border:1px solid #35435e;background:#182238;color:#fff;border-radius:8px;padding:10px 16px;font-weight:800}.nav span{padding:10px 14px;color:#aebbd0}.nav button:disabled{opacity:.35;cursor:not-allowed}.chord{color:#D4AF37 !important}.empty{padding:80px;text-align:center;color:#9fb0ca}
</style>

<style>
html,body{background:#f4f7fb!important;color:#18212f!important}
body{overflow-x:hidden}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96)!important;color:#18212f!important;border-bottom:1px solid #e4e9f0!important;padding:8px 12px!important;gap:8px!important}
.title h1{color:#18212f!important;font-size:clamp(18px,2.2vw,28px)!important}
.title small{color:#667085!important}
.key{color:#8b6500!important}
.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start}
.controls button{background:#fff!important;color:#344054!important;border:1px solid #d8dee8!important;border-radius:7px!important;padding:6px 9px!important;font-size:12px!important}
.stage{max-width:1800px!important;margin:0 auto!important;padding:12px 18px 24px!important}
.stage .section{background:#fff;border-radius:10px;padding:12px 14px;margin:0 0 12px;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.stage .section-title{color:#8b6500!important;font-size:16px!important;margin:0 0 5px!important}
.stage .line{margin:0!important;padding:0!important;line-height:1!important}
.stage .chords{height:1em!important;line-height:1!important;margin:0!important;padding:0!important}
.stage .lyrics{font-family:Consolas,Monaco,"Courier New",monospace!important;font-size:clamp(15px,1.25vw,20px)!important;line-height:1!important}
.nav{padding:6px 10px!important;background:#fff!important;border-top:1px solid #e4e9f0!important}
.nav button{background:#fff!important;color:#344054!important;border:1px solid #d8dee8!important;border-radius:7px!important;padding:7px 10px!important;font-size:12px!important}
#stage{column-count:2;column-gap:28px;column-fill:auto}
#stage .section{break-inside:avoid;column-break-inside:avoid}
@media(max-width:900px){#stage{column-count:1!important}.stage{padding:10px 12px 20px!important}.top{flex-wrap:wrap}.title{min-width:100%}}
</style>

</head>
<body>
<div class="top"><div class="title"><h1 id="songTitle">WorshipHub</h1><small id="songArtist"></small></div><div class="key">Key: <span id="songKey">—</span></div><div class="controls"><button id="minus">A−</button><button id="plus">A+</button><button id="down" title="Transpose down one semitone">♭ Transpose</button><button id="up" title="Transpose up one semitone">♯ Transpose</button><button id="close">✕ Close</button></div></div>
<main id="stage" class="stage"><div class="empty">Loading song…</div></main>
<div class="nav"><button id="prev">◀ Previous</button><span id="counter">Song</span><button id="next">Next ▶</button></div>
<script type="module" src="js/custom-song-runtime.js"></script>
</body>
</html>
