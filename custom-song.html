<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorshipHub Custom Song</title>
<link rel="stylesheet" href="css/modern.css">
<link rel="stylesheet" href="css/style.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#05070c;color:#fff;font-family:Inter,"Segoe UI",Arial,sans-serif}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 18px;background:#10182a;border-bottom:1px solid #26334d}.title{flex:1}.title h1{margin:0;font-size:20px}.title small{color:#9fb0ca}.key{font-weight:800;color:#D4AF37}.controls button{border:1px solid #D4AF37;background:#182238;color:#fff;border-radius:8px;padding:8px 12px}.controls button:hover{background:#3a3117;color:#FFD966}.stage{max-width:1400px;margin:0 auto;padding:36px 5vw}.section{margin-bottom:44px}.section-title{text-transform:uppercase;letter-spacing:.12em;color:#D4AF37;font-size:18px;font-weight:800;margin-bottom:22px}.line{font-family:Consolas,Monaco,"Courier New",monospace;margin-bottom:22px;overflow-x:auto}.chords{position:relative;height:32px;white-space:pre;color:#D4AF37 !important;font-size:clamp(18px,2vw,27px);font-weight:800}.chord{position:absolute;white-space:nowrap;color:#D4AF37 !important}.lyrics{white-space:pre;font-size:clamp(22px,3vw,40px);line-height:1.35}.nav{display:flex;justify-content:center;gap:10px;padding:14px;background:#0c1220;border-top:1px solid #26334d;position:sticky;bottom:0}.nav button{border:1px solid #35435e;background:#182238;color:#fff;border-radius:8px;padding:10px 16px;font-weight:800}.nav span{padding:10px 14px;color:#aebbd0}.nav button:disabled{opacity:.35;cursor:not-allowed}.chord{color:#D4AF37 !important}.empty{padding:80px;text-align:center;color:#9fb0ca}
</style>

<style>
html,body{background:#f4f7fb!important;color:#18212f!important}
body{overflow-x:hidden}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96)!important;color:#18212f!important;border-bottom:1px solid #e4e9f0!important;padding:8px 12px!important;gap:8px!important}
.title h1{color:#18212f!important;font-size:clamp(18px,2.2vw,28px)!important}
.title small{color:#667085!important}
.key{color:#8b6500!important}
.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-start}
.controls button{background:#fff!important;color:#344054!important;border:1px solid #d8dee8!important;border-radius:7px!important;padding:6px 9px!important;font-size:12px!important}
.stage{max-width:1800px!important;margin:0 auto!important;padding:12px 18px 24px!important}
.stage .section{background:#fff;border-radius:10px;padding:12px 14px;margin:0 0 12px;box-shadow:0 8px 24px rgba(16,24,40,.08)}
.stage .section-title{color:#8b6500!important;font-size:16px!important;margin:0 0 5px!important}
.stage .line{margin:0!important;padding:0!important;line-height:1!important}
.stage .chords{height:1em!important;line-height:1!important;margin:0!important;padding:0!important}
.stage .lyrics{font-family:Consolas,Monaco,"Courier New",monospace!important;font-size:clamp(15px,1.25vw,20px)!important;line-height:1!important}
.nav{padding:6px 10px!important;background:#fff!important;border-top:1px solid #e4e9f0!important}
.nav button{background:#fff!important;color:#344054!important;border:1px solid #d8dee8!important;border-radius:7px!important;padding:7px 10px!important;font-size:12px!important}
#stage{column-count:2;column-gap:28px;column-fill:auto}
#stage .section{break-inside:avoid;column-break-inside:avoid}
@media(max-width:900px){#stage{column-count:1!important}.stage{padding:10px 12px 20px!important}.top{flex-wrap:wrap}.title{min-width:100%}}
</style>


<style>
/* ============================================================
   CUSTOM SONG PAGE — MODERN, RESPONSIVE, EXACT CHORD POSITIONING
   Chord positions are based on the character index entered by the admin.
   The chord layer uses the lyric font's character grid, while the chord
   itself is smaller, so changing chord size never moves its position.
============================================================ */
.custom-song-page{--page-bg:#f4f7fb;--surface:#fff;--text:#18212f;--muted:#667085;--gold:#b8860b;--border:#e2e8f0;--chord:#b8860b}
.custom-song-page{min-height:100vh;background:var(--page-bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}
.custom-song-page .top{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);box-shadow:0 2px 14px rgba(16,24,40,.06);padding:10px 14px;display:flex;align-items:center;gap:12px}
.custom-song-page .title{min-width:0;flex:1}.custom-song-page .title h1{margin:0;color:var(--text);font-size:clamp(20px,2.3vw,32px);line-height:1.05}.custom-song-page .title small{color:var(--muted);font-size:13px}
.custom-song-page .key{color:var(--gold);font-weight:900;white-space:nowrap}
.custom-song-page .controls{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:5px}
.custom-song-page .controls button{border:1px solid #d6dee9;background:#fff;color:#344054;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:800;line-height:1;min-height:32px;transition:.15s ease}
.custom-song-page .controls button:hover{border-color:#b8860b;transform:translateY(-1px)}
.custom-song-page .stage{max-width:1900px;margin:0 auto;padding:18px 22px 70px;column-count:2;column-gap:30px;column-fill:auto}
.custom-song-page .section{break-inside:avoid;column-break-inside:avoid;margin:0 0 20px;padding:0 0 2px}
.custom-song-page .section-title{display:inline-block;text-transform:uppercase;letter-spacing:.08em;color:#795800;font-size:clamp(16px,1.4vw,22px);font-weight:900;margin:0 0 8px;padding:5px 10px;border-radius:8px;background:#fff1a8}
.custom-song-page .line{position:relative;margin:0;padding:0;font-family:Consolas,Monaco,"Courier New",monospace;white-space:pre;line-height:1;overflow:visible}
.custom-song-page .chords{position:relative;height:var(--line-font-size,28px);margin:0;padding:0;line-height:1;white-space:pre;font-family:Consolas,Monaco,"Courier New",monospace;font-size:var(--line-font-size,28px);color:transparent;overflow:visible}
.custom-song-page .chord-layer{position:relative;width:max-content;min-width:100%;height:100%;font:inherit;line-height:1;white-space:pre;color:transparent}
.custom-song-page .chord-token{position:absolute;left:calc(var(--chord-pos) * 1ch);top:0;white-space:nowrap;color:var(--chord)!important;font-family:inherit;font-size:.70em;font-weight:900;line-height:1;pointer-events:none}
.custom-song-page .lyrics{margin:0;padding:0;color:var(--text);font-family:Consolas,Monaco,"Courier New",monospace;font-size:clamp(21px,1.8vw,31px);line-height:1;white-space:pre;overflow:visible}
.custom-song-page .nav{position:sticky;bottom:0;z-index:90;display:flex;justify-content:center;gap:8px;padding:7px 10px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--border);box-shadow:0 -2px 12px rgba(16,24,40,.05)}
.custom-song-page .nav button{border:1px solid #d6dee9;background:#fff;color:#344054;border-radius:7px;padding:7px 11px;font-size:12px;font-weight:800}.custom-song-page .nav span{padding:7px 10px;color:var(--muted);font-size:12px;font-weight:800}
.custom-song-page .nav button:disabled{opacity:.4;cursor:not-allowed}
.custom-song-page .empty{padding:70px 20px;text-align:center;color:var(--muted)}
.custom-song-page .source-lyrics{display:none!important}

/* Admin editor */
.custom-editor-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:18px}
.custom-editor-card{width:min(1100px,96vw);max-height:92vh;overflow:auto;background:#fff;color:#18212f;border-radius:16px;box-shadow:0 25px 80px rgba(0,0,0,.25);padding:20px}.custom-editor-card h2{margin:0 0 4px}.custom-editor-note{color:#667085;font-size:13px;margin-bottom:16px}.custom-edit-section{font-weight:900;color:#8b6500;border-top:1px solid #e5e7eb;padding:12px 0 6px}.custom-edit-row{display:grid;grid-template-columns:1fr;gap:6px;margin-bottom:12px}.custom-edit-label{font-size:11px;font-weight:900;color:#667085;text-transform:uppercase;letter-spacing:.05em}.custom-edit-row textarea{width:100%;min-height:48px;resize:vertical;font:16px/1.2 Consolas,monospace;padding:9px;border:1px solid #d8dee8;border-radius:8px;white-space:pre}.custom-edit-row .custom-chord{border-color:#e4bf52;background:#fffdf1}.custom-editor-actions{display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:12px}.custom-editor-actions button{border:1px solid #d8dee8;background:#fff;border-radius:8px;padding:9px 13px;font-weight:700}.custom-editor-actions .primary{background:#182238;color:#fff;border-color:#182238}

/* Same presentation shell as the standard HTML songs. */
#customSongPresentationSource{display:none!important}
@media(max-width:1050px){.custom-song-page .stage{column-count:1!important}.custom-song-page .controls{flex:0 0 100%;justify-content:flex-start}.custom-song-page .top{flex-wrap:wrap}}
@media(max-width:700px){.custom-song-page .top{padding:8px 10px}.custom-song-page .title{flex:1 1 55%}.custom-song-page .key{font-size:12px}.custom-song-page .stage{padding:14px 12px 62px}.custom-song-page .lyrics{font-size:clamp(18px,5vw,25px)}}

/* Keep presentation identical to the main song pages: black, full viewport, scrollable. */
body.presentation-active{overflow:hidden!important}
</style>

<style>
/* Custom-song light/dark toggle */
body.dark-custom{--page-bg:#070b12;--surface:#101722;--text:#f8fafc;--muted:#aab7cb;--border:#273449;--gold:#e4bf52;--chord:#e4bf52;background:var(--page-bg)!important;color:var(--text)!important}
body.dark-custom .top,body.dark-custom .nav{background:rgba(16,23,34,.96)!important;color:var(--text)!important;border-color:var(--border)!important}
body.dark-custom .title h1,body.dark-custom .lyrics{color:var(--text)!important}
body.dark-custom .title small,body.dark-custom .nav span{color:var(--muted)!important}
body.dark-custom .controls button,body.dark-custom .nav button{background:#111827!important;color:#f8fafc!important;border-color:#334155!important}
body.dark-custom .section-title{background:#3a3214!important;color:#f5d76e!important}
</style>
</head>
<body class="custom-song-page">
<div class="top">
  <div class="title"><h1 id="songTitle">WorshipHub</h1><small id="songArtist"></small></div>
  <div class="key">Key: <span id="songKey">—</span></div>
  <div class="controls">
    <button id="homeBtn" title="Home">⌂ Home</button>
    <button id="down" title="Transpose down one semitone">− Transpose</button>
    <button id="up" title="Transpose up one semitone">+ Transpose</button>
    <button id="minus" title="Decrease font">A−</button>
    <button id="plus" title="Increase font">A+</button>
    <button id="themeBtn" title="Toggle dark/light mode">☾ Dark</button>
    <button id="presentationBtn" title="Open presentation">▣ Presentation</button>
    <button id="editBtn" title="Edit chords and lyrics">✎ Edit</button>
  </div>
</div>

<main id="stage" class="stage"><div class="empty">Loading song…</div></main>
<div id="lyrics" class="source-lyrics" aria-hidden="true"></div>

<div class="nav"><button id="prev">◀ Previous</button><span id="counter">Song</span><button id="next">Next ▶</button></div>

<!-- Standard presentation DOM used by the same presentation-runtime.js as all HTML songs. -->
<div id="presentationScreen">
  <div id="presentationHeader">
    <div id="presentationTitle"></div>
    <div id="presentationPassingChords"></div>
    <div id="presentationCounter"></div>
    <div class="presentation-header-actions">
      <button type="button" onclick="previousServiceSong()" title="Previous Song" aria-label="Previous Song">◀</button>
      <button type="button" onclick="nextServiceSong()" title="Next Song" aria-label="Next Song">▶</button>
      <button type="button" onclick="openPresentationSongList()" title="Song List" aria-label="Song List">☰</button>
      <button type="button" onclick="openPresentationSettings()" title="Settings" aria-label="Settings">⚙</button>
      <button type="button" onclick="maximizePresentation()" title="Maximize" aria-label="Maximize">⛶</button>
      <button type="button" onclick="exitPresentation()" title="Close" aria-label="Close">✕</button>
    </div>
  </div>
  <div id="presentationLyrics"></div>
  <div id="presentationNavigation"><div id="nextSongPreview" role="button" tabindex="0" aria-label="Next song preview"></div></div>
</div>
<script type="module" src="js/custom-song-runtime.js"></script>
<script type="module" src="js/presentation-runtime.js"></script>
<script src="js/print-preview.js"></script>
</body>
</html>
