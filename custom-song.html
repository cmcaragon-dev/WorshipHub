<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorshipHub Custom Song</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070c;color:#fff;font-family:Inter,"Segoe UI",Arial,sans-serif}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:14px 18px;background:#10182a;border-bottom:1px solid #26334d}.title{flex:1}.title h1{margin:0;font-size:20px}.title small{color:#9fb0ca}.key{font-weight:800;color:#a5b4fc}.controls button{border:1px solid #35435e;background:#182238;color:#fff;border-radius:8px;padding:8px 12px}.controls button:hover{background:#25324c}.stage{max-width:1400px;margin:0 auto;padding:36px 5vw}.section{margin-bottom:44px}.section-title{text-transform:uppercase;letter-spacing:.12em;color:#a5b4fc;font-size:18px;font-weight:800;margin-bottom:22px}.line{font-family:Consolas,Monaco,"Courier New",monospace;margin-bottom:22px;overflow-x:auto}.chords{position:relative;height:32px;white-space:pre;color:#a5b4fc;font-size:clamp(18px,2vw,27px);font-weight:800}.chord{position:absolute;white-space:nowrap}.lyrics{white-space:pre;font-size:clamp(22px,3vw,40px);line-height:1.35}.nav{display:flex;justify-content:center;gap:10px;padding:14px;background:#0c1220;border-top:1px solid #26334d;position:sticky;bottom:0}.nav button{border:1px solid #35435e;background:#182238;color:#fff;border-radius:8px;padding:10px 16px;font-weight:800}.nav span{padding:10px 14px;color:#aebbd0}.empty{padding:80px;text-align:center;color:#9fb0ca}
</style>
</head>
<body>
<div class="top"><div class="title"><h1 id="songTitle">WorshipHub</h1><small id="songArtist"></small></div><div class="key">Key: <span id="songKey">—</span></div><div class="controls"><button id="minus">A−</button><button id="plus">A+</button><button id="down">−</button><button id="up">+</button><button id="close">✕ Close</button></div></div>
<main id="stage" class="stage"><div class="empty">Loading song…</div></main>
<div class="nav"><button id="prev">◀ Previous</button><span id="counter">Song</span><button id="next">Next ▶</button></div>
<script type="module" src="js/custom-song-runtime.js"></script>
</body>
</html>
