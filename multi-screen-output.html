<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHORDIO Screen Output</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,"Segoe UI",Arial,sans-serif}#app{position:fixed;inset:0;background:#000;overflow:hidden}#bg{position:absolute;inset:0;background:center/cover no-repeat;z-index:0}#bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#shade{position:absolute;inset:0;background:rgba(0,0,0,.15);z-index:1;pointer-events:none}#header{position:absolute;left:0;right:0;top:0;z-index:5;min-height:76px;padding:12px 22px;display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1.8fr) auto;align-items:center;gap:14px;background:rgba(5,8,12,.88);border-bottom:1px solid rgba(255,215,0,.24)}#title{font-size:clamp(20px,2.2vw,36px);font-weight:900}#artist{font-size:clamp(10px,1vw,16px);opacity:.72;margin-left:10px}#key{font-weight:800}#passing{font-size:clamp(10px,1vw,16px);text-align:center}.pass{margin:0 5px}.pass b{color:#FFD700}.sep{opacity:.55}#mode{font-size:11px;font-weight:900;text-transform:uppercase;opacity:.7}#content{position:absolute;inset:0;z-index:3;overflow:hidden}.lyrics{position:absolute;inset:0;padding:6vw;display:flex;flex-direction:column;justify-content:center;text-align:center}.lyrics div{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.15}.chords{position:absolute;inset:76px 0 0;padding:28px 5vw 150px;overflow:auto}.section-title{color:#FFD700;font-weight:900;font-size:clamp(16px,1.7vw,28px);margin:0 0 18px}.line{margin:0 0 10px}.chord{font-family:Consolas,"Courier New",monospace;color:#FFD700;white-space:pre}.lyric{font-family:Consolas,"Courier New",monospace;white-space:pre-wrap;overflow-wrap:anywhere}.lower{position:absolute;right:24px;bottom:24px;z-index:6;display:flex;gap:12px}.box{min-width:150px;max-width:300px;padding:7px 9px;background:rgba(7,7,7,.9);border:1px solid rgba(255,255,255,.12)}.box span{display:block;font-size:8px;opacity:.65}.box strong{display:block;font-size:12px}.box small{font-size:9px;opacity:.7}.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#aaa;font-weight:700}.page{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:7vw;text-align:center}.page-card{display:flex;flex-direction:column;gap:22px;align-items:center}.page-title{font-size:clamp(24px,3vw,52px);font-weight:900;color:#FFD700}.page-text{max-width:1400px;white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><div id="app"><div id="bg"></div><div id="shade"></div><div id="header"><div><span id="title">CHORDIO</span><span id="artist"></span></div><span id="key"></span><div id="passing"></div><span id="mode"></span></div><div id="content"></div><div id="lower" class="lower"><div id="note" class="box"><span>SONG NOTE</span><strong></strong></div><div id="next" class="box"><span>NEXT SONG</span><strong>END OF SERVICE</strong><small></small></div></div></div><script>
(function(){'use strict';const p=new URLSearchParams(location.search),display=String(p.get('display')||'1'),forcedMode=p.get('mode')||'lyrics';let state=null;const $=id=>document.getElementById(id);function read(){for(const k of [`chordioMultiScreenOutputState:${display}`,'chordioMultiScreenState']){try{const x=JSON.parse(localStorage.getItem(k)||'null');if(x?.song)return x}catch(e){}}return null}function escText(x){return String(x??'')}function transposeChordText(text,steps){const sharp=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];const flats={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};const note=(n)=>{const r=n[0].toUpperCase()+n.slice(1);const i=sharp.indexOf(flats[r]||r);return i<0?n:sharp[((i+steps)%12+12)%12]};return String(text||'').replace(/\S+/g,t=>{const m=t.match(/^([A-Ga-g])([#b]?)/);if(!m)return t;let r=note(m[1].toUpperCase()+m[2]);let z=r+t.slice(m[0].length);return z.replace(/\/([A-Ga-g])([#b]?)(?=$|[^A-Za-z])/g,(_,a,b)=>'/'+note(a.toUpperCase()+b))})}function sections(song){return Array.isArray(song?.sections)?song.sections.map(s=>({...s,lines:Array.isArray(s?.lines)?s.lines:[]})):[]}function chordRow(line,steps){let t=typeof line?.chordText==='string'?line.chordText:'';if(t)return transposeChordText(t,steps);const chars=[];for(const c of (Array.isArray(line?.chords)?line.chords:[])){const pos=Math.max(0,Number(c?.position)||0);while(chars.length<pos)chars.push(' ');const v=transposeChordText(String(c?.originalChord||c?.chord||''),steps);Array.from(v).forEach((ch,i)=>chars[pos+i]=ch)}return chars.join('')}function layoutVisible(song,msg){const src=sections(song),lay=Array.isArray(msg?.layout)&&msg.layout.length?msg.layout:src.map((_,i)=>({id:i,visible:true}));return lay.map(x=>({item:x,section:src[Number(x.id)]})).filter(x=>x.section&&x.item.visible!==false)}function settings(msg){return {fontPx:42,spacing:1.15,align:'center',fontFamily:'Arial',color:'#fff',bold:false,italic:false,underline:false,...(msg?.lyricsSettings||{})}}function render(msg){state=msg||state||read();if(!state?.song){$('content').innerHTML='<div class="empty">Waiting for CHORDIO song output…</div>';return}const song=state.song,s=sections(song),mode=state?.modes?.[display]||forcedMode||'lyrics',set=settings(state),bg=state.songBackground||state.background||{type:'none',url:''};$('title').textContent=song.title||'CHORDIO';$('artist').textContent=song.artist||'';$('key').textContent=(song.serviceKey||song.key||song.originalKey)?'Key: '+(song.serviceKey||song.key||song.originalKey):'';$('mode').textContent=mode==='chords'?'Lyrics + Chords':mode==='blank'?'Blank':'Lyrics Only';$('passing').innerHTML='';$('lower').style.display=mode==='chords'?'flex':'none';$('header').style.display=mode==='chords'?'grid':'none';if(bg?.type==='image'&&bg.url){$('bg').style.backgroundImage=`url(${JSON.stringify(String(bg.url))})`}else $('bg').style.backgroundImage='none';let v=$('bg').querySelector('video');if(bg?.type==='video'&&bg.url){if(!v){v=document.createElement('video');v.autoplay=true;v.muted=true;v.loop=true;v.playsInline=true;$('bg').appendChild(v)}if(v.src!==bg.url)v.src=bg.url;v.play().catch(()=>{})}else if(v)v.remove();const next=state.serviceSongs?.[Number(state.serviceIndex)+1];$('note').querySelector('strong').textContent=state.serviceSongs?.[Number(state.serviceIndex)]?.presentationNote||'';$('next').querySelector('strong').textContent=next?.title||'END OF SERVICE';$('next').querySelector('small').textContent=next?'Service Key: '+(next.serviceKey||next.key||next.originalKey||'—'):'';const ps=state.activePageSlide;if(ps){$('header').style.display='none';$('lower').style.display='none';$('content').innerHTML='';const pg=document.createElement('div');pg.className='page';const card=document.createElement('div');card.className='page-card';const t=document.createElement('div');t.className='page-title';t.textContent=ps.title||'';const b=document.createElement('div');b.className='page-text';b.textContent=ps.text||'';b.style.fontFamily=set.fontFamily;b.style.fontWeight=set.bold?'800':'400';b.style.fontStyle=set.italic?'italic':'normal';b.style.textDecoration=set.underline?'underline':'none';b.style.color=set.color;b.style.letterSpacing=(Number(set.letterSpacing||0))+'px';b.style.fontSize=(Number(set.fontPx||42))+'px';b.style.lineHeight=String(set.spacing||1.15);card.append(t,b);pg.append(card);$('content').append(pg);return}if(state.black||mode==='blank'){ $('content').innerHTML='';return}const vis=layoutVisible(song,state);const idx=Math.max(0,Math.min(Number(state.sectionIndex||0),Math.max(0,vis.length-1)));const entry=vis[idx]||vis[0];$('content').innerHTML='';if(!entry){$('content').innerHTML='<div class="empty">No lyrics available for this song.</div>';return}if(mode==='lyrics'){const wrap=document.createElement('div');wrap.className='lyrics';wrap.style.textAlign=set.align;wrap.style.fontFamily=set.fontFamily;wrap.style.color=set.color;wrap.style.fontWeight=set.bold?'800':'400';wrap.style.fontStyle=set.italic?'italic':'normal';wrap.style.textDecoration=set.underline?'underline':'none';wrap.style.letterSpacing=(Number(set.letterSpacing||0))+'px';wrap.style.fontSize=Math.max(16,Math.min(140,Number(set.fontPx||42)))+'px';wrap.style.lineHeight=String(set.spacing||1.15);const overrides=state.lyricsOverrides||{};const lines=Array.isArray(overrides[String(entry.item.id)])?overrides[String(entry.item.id)]:entry.section.lines.map(x=>String(x.lyrics||''));lines.forEach(x=>{const d=document.createElement('div');d.textContent=x;wrap.appendChild(d)});$('content').append(wrap)}else{const wrap=document.createElement('div');wrap.className='chords';const h=document.createElement('div');h.className='section-title';h.textContent=entry.section.title||entry.section.name||('Part '+(idx+1));wrap.append(h);const steps=Number(song.transpose||0),overrides=state.lyricsOverrides||{};const lys=Array.isArray(overrides[String(entry.item.id)])?overrides[String(entry.item.id)]:null;(entry.section.lines||[]).forEach((line,i)=>{const row=document.createElement('div');row.className='line';const c=chordRow(line,steps);if(c){const cd=document.createElement('div');cd.className='chord';cd.textContent=c;row.append(cd)}const ly=document.createElement('div');ly.className='lyric';ly.textContent=lys?String(lys[i]??''):String(line.lyrics||'');ly.style.fontFamily=set.fontFamily;ly.style.fontSize=Math.max(16,Number(set.fontPx||42))+'px';ly.style.lineHeight=String(set.spacing||1.15);ly.style.color=set.color;ly.style.fontWeight=set.bold?'800':'400';ly.style.fontStyle=set.italic?'italic':'normal';ly.style.textDecoration=set.underline?'underline':'none';row.append(ly);wrap.append(row)});$('content').append(wrap)}}window.addEventListener('message',e=>{if(e.data?.type==='chordio-multiscreen-state'){try{localStorage.setItem(`chordioMultiScreenOutputState:${display}`,JSON.stringify(e.data))}catch(_){}render(e.data)}});window.addEventListener('storage',e=>{if(e.key===`chordioMultiScreenOutputState:${display}`||e.key==='chordioMultiScreenState')render(read())});window.addEventListener('resize',()=>render(state||read()));render(read());setTimeout(()=>render(read()),150);setTimeout(()=>render(read()),600);setTimeout(()=>render(read()),1500)})();
</script></body></html>
