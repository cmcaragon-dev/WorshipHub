<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JFCM Songs Organizer</title>

<link rel="stylesheet" href="css/style.css">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ===========================
     HEADER
=========================== -->

<!-- ==========================================
     MODERN TOP NAVIGATION
========================================== -->

<header class="modern-topbar">

    <!-- BRAND -->
    <div class="brand-area">

        <div class="brand-icon">
            <i class="fa-solid fa-music"></i>
        </div>

        <div class="brand-text">
            <div class="brand-title">
                JFCM
            </div>

            <div class="brand-subtitle">
                Songs Organizer
            </div>
        </div>

    </div>


    <!-- NAVIGATION -->
    <nav class="main-navigation">

        <button
            class="nav-item active"
            id="homeNavBtn"
            onclick="window.location.href='index.html'">

            <i class="fa-solid fa-house"></i>

            <span>Home</span>

        </button>


        <button
            class="nav-item"
            id="songsNavBtn"
            onclick="document.getElementById('songGrid')?.scrollIntoView({behavior:'smooth'})">

            <i class="fa-solid fa-music"></i>

            <span>Songs</span>

        </button>


        <button
            class="nav-item"
            id="servicesNavBtn"
            onclick="document.getElementById('servicePlannerBtn')?.click()">

            <i class="fa-solid fa-folder"></i>

            <span>Services</span>

        </button>

    </nav>


    <!-- RIGHT SIDE -->
    <div class="header-actions">

        <!-- SEARCH -->
        <div class="modern-search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="searchBox"
                placeholder="Search songs..."
                autocomplete="off"
                onkeyup="searchSongs(this.value)"
            >

        </div>


        <!-- SETTINGS -->
        <button
            class="icon-action"
            id="settingsTopBtn"
            title="Settings"
            onclick="document.getElementById('settingsBtn')?.click()">

            <i class="fa-solid fa-sliders"></i>

        </button>


        <!-- USER -->
        <button
            class="user-action"
            id="logoutBtn"
            title="Logout">

            <span class="user-avatar">
                <i class="fa-solid fa-user"></i>
            </span>

            <span class="user-label">
                Logout
            </span>

            <i class="fa-solid fa-chevron-down user-arrow"></i>

        </button>

    </div>

</header>



<!-- ===========================
     MAIN LAYOUT
=========================== -->

<div class="layout">

<!-- ===========================
     SIDEBAR
=========================== -->

<aside class="sidebar">

<h3>LIBRARY</h3>

<button id="allSongsBtn">🎵 All Songs</button>

<button id="artistBtn" onclick="showArtist()">
    🎤 Artist
</button>

<button id="categoryBtn">📂 Categories</button>

<button id="favoritesBtn">⭐ Favorites</button>

<button id="recentBtn">🕘 Recently Opened</button>

<button id="continueBtn"> ▶ Continue Last Song </button>
<button id="servicePlannerBtn">     📅 Service Planner </button>

<hr>

<h3>PLAYLISTS</h3>

<button id="playlistBtn">

➕ Playlist Manager

</button>

<hr>

<h3>TOOLS</h3>

<button id="presentationBtn">

📺 Presentation Mode

</button>

<button id="printAllBtn">

🖨 Print Library

</button>

<button id="settingsBtn">

⚙ Settings

</button>

</aside>



<!-- ===========================
     CONTENT
=========================== -->

<main class="content">

<div class="dashboard">

<div class="card">

<div class="number" id="totalSongs">

0

</div>

<div class="label">

Songs

</div>

</div>

<div class="card">

<div class="number" id="totalArtists">

0

</div>

<div class="label">

Artists

</div>

</div>

<div class="card">

<div class="number" id="totalFavorites">

0

</div>

<div class="label">

Favorites

</div>

</div>

<div class="card">

<div class="number" id="totalPlaylists">

0

</div>

<div class="label">

Playlists

</div>

</div>

</div>



<h2>

All Songs

</h2>

<div id="songGrid">

</div>

</main>

</div>



<!-- Playlist Panel -->

<!-- ======================================
     PLAYLIST PANEL
====================================== -->

<div id="playlistPanel" class="playlist-panel">

<div class="playlist-top">

<h2>🎵 Playlist Manager</h2>

<button id="closePlaylist">✖</button>

</div>



<div class="playlist-create">

<input
id="playlistName"
type="text"
placeholder="Enter playlist name">

<button id="createPlaylist">

➕ Create Playlist

</button>

</div>

<hr>

<div id="playlistList">

</div>

</div>

<div id="servicePanel" class="playlist-panel">

    <div class="playlist-top">

        <h2>📅 Worship Service Planner</h2>
	<button id="closeService">✖</button></div>

        <input
            type="text"
            id="serviceName"
            placeholder="Service Name">

        <button id="createService">
            Create Service
        </button>

        <hr>

        <div id="serviceList"></div>



    </div>

</div>
<!-- =================================== -->
<!-- SONG PICKER -->
<!-- =================================== -->

<div id="songPicker" class="popup">

    <div class="popup-box">

        <div class="popup-header">

            <h2>Select Songs</h2>

            <button id="closeSongPicker">✖</button>

        </div>

        <input
            type="text"
            id="songPickerSearch"
            placeholder="Search songs...">

        <div id="songPickerList"></div>

    </div>

</div>
<script
    type="module"
    src="js/firebase.js">
</script>

<script type="module" src="./auth.js"></script>

<script
    type="module"
    src="js/playlist.js">
</script>

<script
    type="module"
    src="js/service.js">
</script>

<script
    type="module"
    src="js/app.js">
</script>



</body>

</html>
