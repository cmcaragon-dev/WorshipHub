<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WorshipHub</title>

<!-- Website Icon / Favicon -->
<link rel="icon" type="image/png" href="images/WHlogo.png">

<link rel="stylesheet" href="css/style.css">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ===========================
     HEADER
=========================== -->

<header class="topbar">

   <div class="logo">

    <img
        src="images/WHlogo.png"
        alt="WorshipHub">
	   <div class="brand">
    <span class="worship">Worship</span><span class="hub">Hub</span>
</div>
</div>

   <div class="top-actions">

    <input
        type="text"
        id="searchBox"
        placeholder="Search songs..."
        onkeyup="searchSongs(this.value)">

    <button onclick="searchSongs()">🔍</button>

    <button id="logoutBtn" type="button">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </button>

</div>

</header>


<!-- ===========================
     MAIN LAYOUT
=========================== -->

<div class="layout">

<aside class="sidebar">

<!-- ===========================
     USER WELCOME
=========================== -->

<div class="user-welcome">

    <div class="welcome-icon">
        👋
    </div>

    <div class="welcome-text">

        <div class="welcome-label">
            Welcome,
        </div>

        <div id="userName" class="welcome-name">
            User
        </div>

    </div>

</div>


<!-- ===========================
     LIBRARY
=========================== -->

<h3>LIBRARY</h3>

<button onclick="showAllSongs()">
    🎵 All Songs
</button>

<button id="servicePlannerBtn">
    📅 Service Planner
</button>

<hr>

<h3>PLAYLISTS</h3>

<button id="playlistBtn">
    ➕ Playlist Manager
</button>

<hr>

<h3>TOOLS</h3>

<button id="settingsBtn">
    ⚙ Settings
</button>

</aside>



<!-- ===========================
     CONTENT
=========================== -->

<main class="content">

<div class="dashboard">

<button class="card dashboard-card" type="button" onclick="showAllSongs()" aria-label="Open all songs">
    <span class="dashboard-card-icon">♫</span>
    <span class="number" id="totalSongs">0</span>
    <span class="label">All Songs</span>
    <span class="dashboard-card-link">Open library →</span>
</button>

<button class="card dashboard-card" type="button" onclick="showAllArtists()" aria-label="Open all artists">
    <span class="dashboard-card-icon">♬</span>
    <span class="number" id="totalArtists">0</span>
    <span class="label">All Artists</span>
    <span class="dashboard-card-link">Browse artists →</span>
</button>

<button class="card dashboard-card" type="button" onclick="showAllServices()" aria-label="Open all services">
    <span class="dashboard-card-icon">▣</span>
    <span class="number" id="totalServices">0</span>
    <span class="label">All Services</span>
    <span class="dashboard-card-link">View service planners →</span>
</button>

<button class="card dashboard-card" type="button" onclick="showAllPlaylists()" aria-label="Open all playlists">
    <span class="dashboard-card-icon">▤</span>
    <span class="number" id="totalPlaylists">0</span>
    <span class="label">All Playlists</span>
    <span class="dashboard-card-link">Browse playlists →</span>
</button>

</div>





<h2>

All Songs

</h2>

<div id="songGrid">

</div>

</main>
</div>


<!-- ======================================
     ALL SONGS PANEL
====================================== -->

<div class="all-songs-panel" id="allSongsPanel">

    <div class="all-songs-header">

        <div>
            <h2>🎵 All Songs</h2>
            <p>Complete song library</p>
        </div>

        <button
            class="close-all-songs"
            onclick="closeAllSongs()">
            ✖
        </button>

    </div>


    <!-- SEARCH -->
    <div class="all-songs-search">

        <input
            type="text"
            id="allSongsSearch"
            placeholder="Search by song title, artist, category or language..."
            autocomplete="off">

        <button
            type="button"
            onclick="searchAllSongs()">
            🔍 Search
        </button>

        <button
            type="button"
            onclick="clearAllSongsSearch()">
            ✖ Clear
        </button>

    </div>


    <div class="all-songs-table-wrapper">

        <table class="all-songs-table">

            <thead>
                <tr>
                    <th>#</th>
                    <th>Song Title</th>
                    <th>Artist</th>
                    <th>Category</th>					 
                    <th>Language</th>
					<th>Key</th>
                </tr>
            </thead>

            <tbody id="allSongsTableBody">
            </tbody>

        </table>

    </div>

</div>

<!-- Playlist Panel -->

<!-- ======================================
     PLAYLIST PANEL
====================================== -->

<div id="playlistPanel" class="playlist-panel">

<div class="playlist-top">

<h2>🎵 Playlist Manager</h2>

<button id="closePlaylist">✖</button>

</div>



<div class="playlist-create">

<input
id="playlistName"
type="text"
placeholder="Enter playlist name">

<button id="createPlaylist">

➕ Create Playlist

</button>

</div>

<hr>

<div id="playlistList">

</div>

</div>

<div id="servicePanel" class="playlist-panel">

    <div class="playlist-top">

        <h2>📅 Worship Service Planner</h2>
	<button id="closeService">✖</button></div>

        <input
            type="text"
            id="serviceName"
            placeholder="Service Name">

        <button id="createService">
            Create Service
        </button>

        <hr>

        <div id="serviceList"></div>



    </div>

</div>
<!-- =================================== -->
<!-- INDEX INTERNAL DIRECTORY VIEWS -->
<!-- =================================== -->
<div id="indexDirectoryPanel" class="index-directory-panel" aria-hidden="true">
    <div class="index-directory-card">
        <div class="index-directory-header">
            <div>
                <span id="indexDirectoryEyebrow" class="index-directory-eyebrow">LIBRARY</span>
                <h2 id="indexDirectoryTitle">All Artists</h2>
                <p id="indexDirectorySubtitle">Browse the complete artist list.</p>
            </div>
            <button id="closeIndexDirectory" class="index-directory-close" type="button" aria-label="Close">×</button>
        </div>
        <div id="indexDirectoryContent" class="index-directory-content"></div>
    </div>
</div>

<!-- =================================== -->
<!-- SONG PICKER -->
<!-- =================================== -->

<div id="songPicker" class="popup">

    <div class="popup-box">

        <div class="popup-header">

            <h2>Select Songs</h2>

            <button id="closeSongPicker">✖</button>

        </div>

        <input
            type="text"
            id="songPickerSearch"
            placeholder="Search songs...">

        <div id="songPickerList"></div>

    </div>

</div>
<script
    type="module"
    src="js/firebase.js">
</script>

<script type="module" src="js/auth.js"></script>

<script
    type="module"
    src="js/app.js">
</script>



</body>

</html>
